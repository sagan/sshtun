[package]
name = "sshtun"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
russh = "0.45"
russh-keys = "0.45"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
ssh2-config = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.6"
futures = "0.3"
tokio-tun = "0.11"
ipnetwork = "0.20"
nix = { version = "0.29", features = ["net", "process", "user", "fs"] }

[patch.crates-io]
russh = { path = "./crates/russh" }
